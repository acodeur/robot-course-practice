#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
========================================
步态参数 dynamic_reconfigure 配置
========================================
rqt_reconfigure 只管调参，方向由键盘 WASDQE 控制。

用法：
  1. catkin_make 编译后自动生成 Python 绑定
  2. 启动 walk_demo.py 后，运行：
     rosrun rqt_reconfigure rqt_reconfigure
  3. 在 GUI 中实时调节步态参数
  4. 在 walk_demo.py 终端中用键盘 W/S/A/D/Q/E/Space 控制方向
"""

PACKAGE = "humanoid_sim"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ---------- 步态参数（rqt_reconfigure 调节） ----------
gen.add("freq",        double_t, 0, "步态频率 (Hz)",        1.7,  0.5,  3.0)
gen.add("step_gain",   double_t, 0, "步幅 (m)",            0.02, 0.0,  0.04)
gen.add("rise_gain",   double_t, 0, "抬脚高度 (m)",        0.035,0.01, 0.06)
gen.add("swing_gain",  double_t, 0, "侧摆幅度 (m)",        0.02, 0.0,  0.05)
gen.add("turn_gain",   double_t, 0, "转向幅度 (rad)",      0.2,  0.0,  0.3)
gen.add("lateral_gain",double_t, 0, "侧向步幅 (m)",        0.02, 0.0,  0.03)

# ---------- 重心参数（影响稳定性） ----------
gen.add("trunk_pitch",   double_t, 0, "躯干前倾角 (rad)",  0.05, -0.1,  0.2)
gen.add("trunk_z_offset",double_t, 0, "重心高度偏移 (m)",  0.02,  0.0,  0.05)

exit(gen.generate(PACKAGE, "humanoid_sim", "WalkParams"))
