# YOLO 检测不稳定时的兜底 bbox 样例。
# 格式与 yolo/outputs/detections.yaml 保持一致。

image: "yolo/images/gazebo_camera.png"
image_width: 640
image_height: 480
detections:
  - index: 0
    class_name: "target_ball_sample"
    confidence: 0.90
    bbox_xyxy: [280.0, 220.0, 360.0, 300.0]

note: "这是课堂兜底样例，不代表真实 YOLO 输出。录课时优先使用真实 detections.yaml。"
